# Dummy Xorg display for UNO Q remote streaming (RustDesk/x11vnc).
#
# Only needed if you do NOT have a real HDMI/DisplayPort monitor
# reliably attached. It gives Xorg one enumerable virtual output so
# screen-sharing tools that refuse to attach to a "zero displays"
# session (RustDesk does this) have something to grab.
#
# Install location: /etc/X11/xorg.conf.d/10-dummy.conf
# Requires: sudo apt install xserver-xorg-video-dummy
#
# Resolution below is 1920x1080 @ 60Hz. If you want to match your
# game's native window size instead, swap the Modeline/Modes values
# (e.g. use `cvt 1280 720 60` on any Linux box to generate a new
# Modeline for a different resolution).

Section "Monitor"
    Identifier "DummyMonitor"
    HorizSync 28.0 - 80.0
    VertRefresh 48.0 - 75.0
    Modeline "1920x1080" 172.80 1920 1968 2000 2080 1080 1083 1088 1100
EndSection

Section "Device"
    Identifier "DummyDevice"
    Driver "dummy"
    VideoRam 256000
EndSection

Section "Screen"
    Identifier "DummyScreen"
    Device "DummyDevice"
    Monitor "DummyMonitor"
    DefaultDepth 24
    SubSection "Display"
        Depth 24
        Modes "1920x1080"
    EndSubSection
EndSection
